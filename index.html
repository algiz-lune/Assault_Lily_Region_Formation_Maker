<!DOCTYPE html>
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>アサルトリリィ レギオン フォーメーションメーカー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+Display:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Serif Display', 'Noto Serif JP', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', serif;
  background: #f0f2f5;
  color: #1a1a2e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 12px;
}

.title {
  position: relative;
  width: 100%;
  margin: 4px 0 22px;
  padding: 18px 12px 20px;
  color: #263b59;
  font-size: clamp(25px, 5.5vw, 40px);
  font-weight: 900;
  line-height: 1.2;
  letter-spacing: 0.035em;
  text-align: center;
  text-wrap: balance;
  background: linear-gradient(110deg, #000000 5%, #787878 48%, #000000 92%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 1px rgba(24, 42, 66, 0.12));
}

.title::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  width: min(800px, 42%);
  height: 3px;
  border-radius: 99px;
  background: linear-gradient(90deg, transparent, #a98b56 22%, #d4c19b 50%, #a98b56 78%, transparent);
  transform: translateX(-50%);
}

@media (max-width: 480px) {
  .title {
    padding: 14px 8px 17px;
    margin-bottom: 18px;
    letter-spacing: 0.01em;
  }

  .title::before {
    font-size: 8px;
    letter-spacing: 0.16em;
  }
}

.title-img {
  width: 100%;
  max-width: 340px;
  height: auto;
  margin-bottom: 8px;
}
.btn-img {
  height: 36px;
  width: auto;
}

.controls {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  z-index: 10;
}

.controls button {
  padding: 0;
  border: none;
  border-radius: 8px;
  font-family: 'Noto Serif Display', 'Noto Serif JP', 'Noto Sans JP', serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.controls button:active { transform: scale(0.96); opacity: 0.8; }

.btn-screenshot, .btn-reset {
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
}
.btn-screenshot .btn-img, .btn-reset .btn-img {
  height: 32px;
  width: auto;
  border: 1px solid #1a1a2e;
  border-radius: 6px;
}

/* === Input Panel === */
.panel {
  background: #fff;
  border-radius: 12px;
  padding: 16px 14px;
  width: 100%;
  max-width: 400px;
  z-index: 1;
  margin-bottom: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.panel-step {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding: 10px 12px;
  background: #f8f9fa;
  border-radius: 8px;
  border-left: 4px solid #1a1a2e;
}
.panel-step-num {
  font-size: 13px;
  font-weight: 900;
  color: #fff;
  background: #1a1a2e;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.panel-step-text {
  font-size: 13px;
  color: #495057;
  font-weight: 700;
}

.zone-group { margin-bottom: 10px; }
.zone-group:last-child { margin-bottom: 0; }

.zone-group-header {
  font-size: 11px;
  font-weight: 900;
  color: #6c757d;
  margin-bottom: 6px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.zone-group-header .zone-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.zone-dot-az { background: #e63946; }
.zone-dot-tz { background: #2b6cb0; }
.zone-dot-bz { background: #7c3aed; }

.zone-inputs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.zone-inputs input {
  width: calc(20% - 5px);
  min-width: 54px;
  padding: 10px 6px;
  border: 2px solid #dee2e6;
  border-radius: 8px;
  background: #fff;
  color: #1a1a2e;
  font-size: 14px;
  font-weight: 700;
  outline: none;
  text-align: center;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.zone-inputs input:focus {
  border-color: #4dabf7;
  box-shadow: 0 0 0 3px rgba(77,171,247,0.2);
}
.zone-inputs input::placeholder { color: #adb5bd; font-size: 12px; font-weight: 400; }

/* === Field === */
.field-step {
  width: 100%;
  max-width: 400px;
}
.field-step .panel-step {
  background: #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

/* === Formation container with official background image === */
.formation-container {
  width: 100%;
  max-width: 520px;
  position: relative;
  background: url('formation_map_re.png') center/cover no-repeat;  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  margin-bottom: 12px;
}

.huge-bar {
  width: 100%;
  height: 36px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  /* transparent — image provides HUGE */
}
.huge-bar::after, .huge-bar::before { display: none; }
.huge-text { display: none; }

.field-wrapper {
  position: relative;
  width: 100%;
  z-index: 1;
}

#field {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: transparent;
  position: relative;
  overflow: hidden;
  cursor: default;
  touch-action: none;
}

/* Grid/decoration hidden — image provides everything */
#field::before { display: none; }
.lane-line, .lane-bg, .zone-bg, .zone-label, .field-border, .corner-mark { display: none; }

.lane-labels {
  width: 100%;
  height: 22px;
  display: flex;
  pointer-events: none;
  z-index: 2;
  /* transparent — image provides lane labels */
}
.lane-label { visibility: hidden; }

/* === Player Tokens === */
.player-token {
  position: absolute;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: grab;
  user-select: none;
  transition: box-shadow 0.2s, opacity 0.3s;
  z-index: 10;
  touch-action: none;
  color: #fff;
  border: 2px solid rgba(255,255,255,0.4);
}
.player-token.hidden { opacity: 0; pointer-events: none; }
.player-token:hover { box-shadow: 0 0 20px rgba(255,255,255,0.5); }
.player-token.dragging { cursor: grabbing; box-shadow: 0 0 28px rgba(255,255,255,0.7); z-index: 100; }

.player-token .token-number {
  font-size: 17px;
  font-weight: 900;
  line-height: 1;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.player-token .token-name {
  font-size: 9px;
  font-weight: 700;
  white-space: nowrap;
  max-width: 70px;
  overflow: hidden;
  text-overflow: ellipsis;
  position: absolute;
  bottom: -16px;
  background: rgba(26,26,46,0.9);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.15);
  text-shadow: none;
}

.color-az {
  background: radial-gradient(circle at 35% 35%, #ff6b7a, #e63946);
  box-shadow: 0 2px 12px rgba(230,57,70,0.5);
}
.color-tz {
  background: radial-gradient(circle at 35% 35%, #4dabf7, #2b6cb0);
  box-shadow: 0 2px 12px rgba(43,108,176,0.4);
}
.color-bz {
  background: radial-gradient(circle at 35% 35%, #a78bfa, #7c3aed);
  box-shadow: 0 2px 12px rgba(124,58,237,0.4);
}

.field-title {
  position: absolute;
  bottom: 12px;
  left: 0; right: 0;
  text-align: center;
  z-index: 5;
  pointer-events: none;
}
.field-title input {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8);
  font-family: 'Noto Serif Display', 'Noto Serif JP', 'Noto Sans JP', serif;
  font-size: 14px;
  font-weight: 900;
  text-align: center;
  outline: none;
  padding: 4px 8px;
  pointer-events: all;
  width: 240px;
  letter-spacing: 2px;
}
.field-title input::placeholder { color: rgba(255,255,255,0.25); }
.field-title input:focus { border-bottom-color: rgba(255,255,255,0.5); }

/* Screenshot overlay */
.screenshot-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 20px;
}
.screenshot-overlay img {
  max-width: 90%;
  max-height: 60vh;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.screenshot-overlay .ss-hint {
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
}
.screenshot-overlay .ss-close {
  padding: 12px 32px;
  background: #e63946;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Noto Serif Display', 'Noto Serif JP', 'Noto Sans JP', serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.screenshot-flash {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: #fff;
  color: #1a1a2e;
  padding: 16px 40px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 4px;
  z-index: 9999;
  pointer-events: none;
  animation: flash-in-out 1.5s ease forwards;
  box-shadow: 0 4px 30px rgba(0,0,0,0.2);
}
@keyframes flash-in-out {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>

    <div class="corner-mark corner-br"></div>
    <div class="zone-label zone-label-az">AZ</div>
    <div class="zone-label zone-label-tz">TZ</div>
    <div class="zone-label zone-label-bz">BZ</div>
    <div class="field-title">
      <input type="text" id="formationTitle" placeholder="LEGION NAME">
    </div>
  <div class="player-token color-az hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-az hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-az hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-az hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-az hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-tz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-tz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-tz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-tz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-tz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-bz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-bz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-bz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-bz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div><div class="player-token color-bz hidden" data-dragged=""><span class="token-number"></span><span class="token-name"></span></div></div>
</div>
</div><!-- /.formation-container -->

<script>
var field = document.getElementById('field');
var TOKEN_SIZE = 50;
var INITIAL_SLOTS = 5;

var zones = ['az', 'tz', 'bz'];
var zoneData = {
  az: { inputs: [], tokens: [], yRange: [12, 30] },
  tz: { inputs: [], tokens: [], yRange: [38, 62] },
  bz: { inputs: [], tokens: [], yRange: [70, 88] }
};
var colorClass = { az: 'color-az', tz: 'color-tz', bz: 'color-bz' };
var zoneColors = {
  az: { fill: '#e63946', highlight: '#ff6b7a' },
  tz: { fill: '#2b6cb0', highlight: '#4dabf7' },
  bz: { fill: '#7c3aed', highlight: '#a78bfa' }
};

function getSpreadPositions(count, yRange) {
  var positions = [];
  for (var i = 0; i < count; i++) {
    var xPad = 12;
    var x = count === 1 ? 50 : xPad + (100 - xPad * 2) * i / (count - 1);
    var yMid = (yRange[0] + yRange[1]) / 2;
    var ySpread = (yRange[1] - yRange[0]) * 0.3;
    var wave = Math.sin((i / Math.max(count - 1, 1)) * Math.PI);
    var y = yMid - wave * ySpread;
    positions.push({ x: x, y: y });
  }
  return positions;
}

function createToken(zone) {
  var token = document.createElement('div');
  token.className = 'player-token ' + colorClass[zone] + ' hidden';
  token.innerHTML = '<span class="token-number"></span><span class="token-name"></span>';
  setupDrag(token);
  field.appendChild(token);
  return token;
}

function createInput(zone, idx) {
  var input = document.createElement('input');
  input.type = 'text';
  input.placeholder = '名前' + (idx + 1);
  input.addEventListener('input', function() { onInputChange(zone); });
  document.getElementById('inputs-' + zone).appendChild(input);
  return input;
}

function initZone(zone) {
  for (var i = 0; i < INITIAL_SLOTS; i++) {
    zoneData[zone].inputs.push(createInput(zone, i));
    zoneData[zone].tokens.push(createToken(zone));
  }
}

function onInputChange(zone) {
  var zd = zoneData[zone];

  var allFilled = zd.inputs.length > 0 && zd.inputs.every(function(inp) { return inp.value.trim() !== ''; });
  if (allFilled) {
    var newIdx = zd.inputs.length;
    zd.inputs.push(createInput(zone, newIdx));
    zd.tokens.push(createToken(zone));
  }

  var filledIndices = [];
  for (var i = 0; i < zd.inputs.length; i++) {
    if (zd.inputs[i].value.trim()) {
      filledIndices.push(i);
    }
  }

  var positions = getSpreadPositions(filledIndices.length, zd.yRange);
  var fieldW = field.offsetWidth;
  var fieldH = field.offsetHeight;
  var pIdx = 0;

  for (var i = 0; i < zd.tokens.length; i++) {
    var token = zd.tokens[i];
    var val = zd.inputs[i].value.trim();
    if (val) {
      var pos = positions[pIdx];
      token.classList.remove('hidden');
      if (!token.dataset.dragged) {
        token.style.left = (pos.x / 100 * fieldW - TOKEN_SIZE / 2) + 'px';
        token.style.top = (pos.y / 100 * fieldH - TOKEN_SIZE / 2) + 'px';
      }
      token.querySelector('.token-number').textContent = val.charAt(0);
      token.querySelector('.token-name').textContent = val;
      pIdx++;
    } else {
      token.classList.add('hidden');
      token.dataset.dragged = '';
    }
  }
}

function setupDrag(token) {
  function onStart(e) {
    if (token.classList.contains('hidden')) return;
    e.preventDefault();
    token.classList.add('dragging');
    var point = e.touches ? e.touches[0] : e;
    var startX = point.clientX;
    var startY = point.clientY;
    var origX = parseFloat(token.style.left);
    var origY = parseFloat(token.style.top);

    function onMove(e) {
      var p = e.touches ? e.touches[0] : e;
      var newX = origX + (p.clientX - startX);
      var newY = origY + (p.clientY - startY);
      var maxX = field.offsetWidth - TOKEN_SIZE;
      var maxY = field.offsetHeight - TOKEN_SIZE;
      token.style.left = Math.max(0, Math.min(maxX, newX)) + 'px';
      token.style.top = Math.max(0, Math.min(maxY, newY)) + 'px';
      token.dataset.dragged = '1';
    }

    function onEnd() {
      token.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
  }

  token.addEventListener('mousedown', onStart);
  token.addEventListener('touchstart', onStart, { passive: false });
}

// === Canvas-based screenshot ===
// Background image embedded as base64 (resized JPEG for canvas screenshot)
var bgImg = new Image();
bgImg.src = 'formation_map_re.png';

function takeScreenshot() {
  var fieldW = field.offsetWidth;
  var fieldH = field.offsetHeight;
  var scale = 4;
  var hugeBarH = 36;
  var labelBarH = 22;
  var totalH = hugeBarH + labelBarH + fieldH;

  var canvas = document.createElement('canvas');
  canvas.width = fieldW * scale;
  canvas.height = totalH * scale;
  var ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // Draw background image covering entire area
  ctx.drawImage(bgImg, 0, 0, fieldW, totalH);

  // === Field area (tokens only) ===
  ctx.save();
  ctx.translate(0, hugeBarH + labelBarH);

  // Draw tokens
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  zones.forEach(function(zone) {
    var zd = zoneData[zone];
    var colors = zoneColors[zone];

    for (var i = 0; i < zd.tokens.length; i++) {
      var token = zd.tokens[i];
      if (token.classList.contains('hidden')) continue;

      var tx = parseFloat(token.style.left) + TOKEN_SIZE / 2;
      var ty = parseFloat(token.style.top) + TOKEN_SIZE / 2;
      var r = TOKEN_SIZE / 2;

      var grad = ctx.createRadialGradient(tx - r * 0.3, ty - r * 0.3, 0, tx, ty, r);
      grad.addColorStop(0, colors.highlight);
      grad.addColorStop(1, colors.fill);

      // Border
      ctx.beginPath();
      ctx.arc(tx, ty, r + 1, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(tx, ty, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.shadowColor = colors.fill;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(tx, ty, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      var name = zd.inputs[i].value.trim();
      ctx.font = '900 17px Noto Serif Display, Noto Sans JP, serif';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 3;
      ctx.fillText(name.charAt(0), tx, ty);
      ctx.shadowBlur = 0;

      ctx.font = '700 9px Noto Serif Display, Noto Sans JP, serif';
      var labelW = ctx.measureText(name).width + 12;
      ctx.fillStyle = 'rgba(26,26,46,0.9)';
      var labelX = tx - labelW / 2;
      var labelY = ty + r + 3;
      ctx.beginPath();
      ctx.roundRect(labelX, labelY, labelW, 14, 3);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(labelX, labelY, labelW, 14, 3);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText(name, tx, labelY + 7);
    }
  });

  // Legion name
  var title = document.getElementById('formationTitle').value;
  if (title) {
    ctx.font = '900 14px Noto Serif Display, Noto Sans JP, serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '2px';
    ctx.fillText(title, fieldW / 2, fieldH - 14);
  }

  ctx.restore();

  // Output
  var dataUrl = canvas.toDataURL('image/png');
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

  if (isIOS) {
    var overlay = document.createElement('div');
    overlay.className = 'screenshot-overlay';
    var img = document.createElement('img');
    img.src = dataUrl;
    var hint = document.createElement('div');
    hint.className = 'ss-hint';
    hint.textContent = '画像を長押しして保存';
    var closeBtn = document.createElement('button');
    closeBtn.className = 'ss-close';
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', function() { overlay.remove(); });
    overlay.appendChild(img);
    overlay.appendChild(hint);
    overlay.appendChild(closeBtn);
    document.body.appendChild(overlay);
  } else {
    var link = document.createElement('a');
    link.download = (title || 'formation') + '.png';
    link.href = dataUrl;
    link.click();

    var flash = document.createElement('div');
    flash.className = 'screenshot-flash';
    flash.textContent = 'SAVED';
    document.body.appendChild(flash);
    setTimeout(function() { flash.remove(); }, 1500);
  }
}

function resetAll() {
  zones.forEach(function(zone) {
    var zd = zoneData[zone];
    while (zd.inputs.length > INITIAL_SLOTS) {
      var inp = zd.inputs.pop();
      inp.remove();
      var tok = zd.tokens.pop();
      tok.remove();
    }
    zd.inputs.forEach(function(inp) { inp.value = ''; });
    zd.tokens.forEach(function(tok) {
      tok.classList.add('hidden');
      tok.dataset.dragged = '';
    });
  });
}

document.getElementById('btnScreenshot').addEventListener('click', takeScreenshot);
document.getElementById('btnReset').addEventListener('click', resetAll);
window.addEventListener('resize', function() {
  zones.forEach(function(zone) { onInputChange(zone); });
});

zones.forEach(function(zone) { initZone(zone); });
</script>
